name: Deploy Docs
on:
    push:
        branches: ["main"]
permissions:
    contents: read

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        steps:
            - uses: actions/checkout@v5

            - name: Upload Pages
              uses: actions/upload-pages-artifact@v5
              with:
                  path: "./docs"
                  include-hidden-files: true

            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v5
